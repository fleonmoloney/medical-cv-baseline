[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medcv"
version = "0.1.0"
description = "Línea base reproducible de visión por computadora sobre MedMNIST, con evaluación honesta"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando León Moloney" }]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "medmnist>=3.0",
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
